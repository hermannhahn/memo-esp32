<!DOCTYPE html>
<html>

<head>
    <title>Network Configuration</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="referrer no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/css">
        :root {
            --bg-primary: #0a0b0d;
            --bg-secondary: #13151a;
            --bg-card: rgba(26, 29, 36, 0.75);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --input-bg: rgba(15, 17, 23, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* ========== Header Styles ========== */
        header {
            width: 100%;
            background: linear-gradient(135deg, var(--bg-secondary), #1e1b4b);
            border-bottom: 1px solid var(--border);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ========== Language Switcher ========== */
        .language-switch select {
            padding: 6px 12px;
            background-color: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .language-switch select:focus {
            border-color: var(--accent);
        }

        /* ========== Container & Card ========== */
        .container {
            max-width: 600px;
            width: 100%;
            padding: 1.5rem;
            margin-top: 1rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            margin-bottom: 1.5rem;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent);
            padding-left: 0.75rem;
        }

        /* ========== Tabs ========== */
        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
            width: 100%;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.8rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* ========== Form Elements ========== */
        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .form-control[readonly] {
            cursor: pointer;
            opacity: 0.85;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* ========== Buttons ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(to right, #6366f1, #818cf8);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(to right, #4f46e5, #6366f1);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: var(--border);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-icon {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            width: auto;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.6rem 1rem;
        }

        .btn-icon:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ========== Wi-Fi Lists ========== */
        .wifi-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .wifi-list-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.3rem;
        }

        .wifi-item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .wifi-item-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent);
            transform: translateX(3px);
        }

        .wifi-item-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .wifi-item-signal {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* ========== Saved Wi-Fi List ========== */
        .saved-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .saved-item-actions {
            display: flex;
            gap: 0.4rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.85rem;
        }

        .action-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        /* ========== Alerts & Loading ========== */
        .error-msg {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            padding: 0.8rem;
            margin-bottom: 1.2rem;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #1e1b4b;
            border: 1px solid var(--accent);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 12px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            font-weight: 500;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 11, 13, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .loading-text {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 600;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('wifi')" data-lang="wifi_tab">Wi-Fi Config</button>
            <button class="tab-btn" onclick="switchTab('advanced')" data-lang="advanced_tab">Advanced</button>
        </div>

        <!-- Wi-Fi Configuration Tab -->
        <div id="wifi-tab" class="tab-content active">
            <!-- Saved Wi-Fi List -->
            <div id="saved_list_container" class="card" style="display: none;">
                <h2 data-lang="saved_wifi">Saved Networks</h2>
                <div id="saved_list"></div>
            </div>

            <!-- New Wi-Fi Connection -->
            <div class="card">
                <h2 data-lang="new_wifi">Configure New Wi-Fi</h2>
                <div class="error-msg" style="display: none;" id="error"></div>
                <form action="/submit" method="post" onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label for="ssid">SSID:</label>
                        <input type="text" id="ssid" name="ssid" class="form-control" required readonly
                            placeholder="Select a network below">
                    </div>
                    <div class="form-group">
                        <label for="password" data-lang="password">Password:</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="password" id="password" name="password" class="form-control" style="padding-right: 40px;">
                            <span id="togglePassword" style="position: absolute; right: 12px; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; user-select: none;">👁️</span>
                        </div>
                    </div>
                    <button type="submit" id="button" class="btn btn-primary" data-lang="connect">Connect</button>
                </form>

                <div id="ap_list" class="wifi-list"></div>
            </div>
        </div>

        <!-- Advanced Configuration Tab -->
        <div id="advanced-tab" class="tab-content">
            <div class="card">
                <h2 data-lang="advanced_tab">Advanced Settings</h2>
                <div class="error-msg" style="display: none;" id="advanced_error"></div>

                <form action="/advanced/submit" method="post" onsubmit="submitAdvancedForm(event)">
                    <!-- VAD Threshold -->
                    <div class="form-group">
                        <label>VAD RMS Real-time:</label>
                        <div style="width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-bottom: 5px;">
                            <div id="vad_rms_bar" style="width: 0%; height: 100%; background: linear-gradient(to right, var(--success), var(--warning), var(--danger)); transition: width 0.1s;"></div>
                        </div>
                        <label for="vad_threshold" data-lang="vad_threshold">Sensibilidade do Microfone (VAD
                            RMS):</label>
                        <input type="range" id="vad_threshold" name="vad_threshold" min="100" max="4000" step="10"
                            value="1500" oninput="document.getElementById('vad_val').innerText = this.value"
                            style="width:100%;">
                        <div style="text-align: center; margin-top: 5px;"><span id="vad_val">1500</span></div>
                    </div>

                    <!-- Max TX Power -->
                    <div class="form-group">
                        <label for="max_tx_power" data-lang="max_tx_power">Wi-Fi Max TX Power:</label>
                        <select id="max_tx_power" name="max_tx_power" class="form-control">
                            <option value="8">2 dBm</option>
                            <option value="20">5 dBm</option>
                            <option value="28">7 dBm</option>
                            <option value="34">8 dBm</option>
                            <option value="44">11 dBm</option>
                            <option value="52">13 dBm</option>
                            <option value="56">14 dBm</option>
                            <option value="60">15 dBm</option>
                            <option value="66">16 dBm</option>
                            <option value="72">18 dBm</option>
                            <option value="80">20 dBm</option>
                        </select>
                    </div>

                    <!-- Remember BSSID -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember_bssid" name="remember_bssid">
                        <label for="remember_bssid" data-lang="remember_bssid">Remember BSSID when connecting</label>
                    </div>

                    <!-- Sleep Mode -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="sleep_mode" name="sleep_mode">
                        <label for="sleep_mode" data-lang="sleep_mode">Enable Sleep Mode</label>
                    </div>

                    <button type="submit" id="advanced_button" class="btn btn-primary" style="margin-top: 1.5rem;"
                        data-lang="save">Save Settings</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

        // ========== Helper Functions ==========
        function changeLanguage() {
            const lang = document.getElementById('language').value;
            if (!translations[lang]) {
                document.getElementById('language').value = 'en-US';
                return changeLanguage();
            }

            document.title = translations[lang].title;

            document.querySelectorAll('[data-lang]').forEach(element => {
                const key = element.getAttribute('data-lang');
                element.textContent = translations[lang][key];
            });

            document.querySelectorAll('[data-lang-value]').forEach(element => {
                const key = element.getAttribute('data-lang-value');
                element.value = translations[lang][key];
            });

            const apList = document.getElementById('ap_list');
            const wifiTitle = apList.querySelector('.wifi-list-title');
            if (wifiTitle) {
                wifiTitle.textContent = support5G ? translations[lang].select_wifi_5g : translations[lang].select_wifi;
            }

            localStorage.setItem('preferred_language', lang);
        }

        // ========== Wi-Fi List Management ==========
        function renderSavedList(data) {
            const savedListContainer = document.getElementById('saved_list_container');
            const savedList = document.getElementById('saved_list');
            savedList.innerHTML = '';

            data.forEach((ssidName, index) => {
                const div = document.createElement('div');
                div.className = 'saved-item';

                let html = `<span>🔑 <strong>${ssidName}</strong></span>`;
                html += `<div class="saved-item-actions">`;
                if (index > 0) {
                    html += `<button type="button" class="action-btn" onclick="setDefaultItem(this, ${index})">▲</button>`;
                }
                html += `<button type="button" class="action-btn delete" onclick="deleteItem(this, ${index})">✕</button>`;
                html += `</div>`;

                div.innerHTML = html;
                savedList.appendChild(div);
            });

            savedListContainer.style.display = data.length > 0 ? 'block' : 'none';
        }

        function deleteItem(item, index) {
            item.disabled = true;
            fetch('/saved/delete?index=' + index)
                .then(response => response.json())
                .then(() => loadSavedList());
        }

        function setDefaultItem(item, index) {
            item.disabled = true;
            fetch('/saved/set_default?index=' + index)
                .then(response => response.json())
                .then(() => loadSavedList());
        }

        function loadSavedList() {
            fetch('/saved/list')
                .then(response => response.json())
                .then(data => renderSavedList(data));
        }

        function loadAPList() {
            if (button.disabled) return;

            const lang = document.getElementById('language').value;
            const apList = document.getElementById('ap_list');
            const hasExistingAPs = apList.querySelector('.wifi-item-card') !== null;

            if (!hasExistingAPs) {
                apList.innerHTML = '<div class="wifi-list-title">' + translations[lang].scanning + '</div>';
            }

            fetch('/scan')
                .then(response => response.json())
                .then(data => {
                    support5G = data.support_5g;
                    const selectText = support5G ? translations[lang].select_wifi_5g : translations[lang].select_wifi;
                    apList.innerHTML = '<div class="wifi-list-title">' + selectText + '</div>';

                    data.aps.forEach(ap => {
                        const card = document.createElement('div');
                        card.className = 'wifi-item-card';

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'wifi-item-info';
                        infoDiv.innerHTML = `<span>${ap.authmode === 0 ? '🔓' : '🔒'}</span> <strong>${ap.ssid}</strong>`;

                        const signalSpan = document.createElement('span');
                        signalSpan.className = 'wifi-item-signal';
                        signalSpan.textContent = `${ap.rssi} dBm`;

                        card.appendChild(infoDiv);
                        card.appendChild(signalSpan);

                        card.addEventListener('click', () => {
                            ssid.value = ap.ssid;
                            document.getElementById('password').focus();
                        });

                        apList.appendChild(card);
                    });

                    setTimeout(loadAPList, 5000);
                })
                .catch(error => {
                    console.error('Error:', error);
                    setTimeout(loadAPList, 5000);
                });
        }

        // ========== Form Submission ==========
        async function submitForm(event) {
            event.preventDefault();
            button.disabled = true;
            error.style.display = 'none';
            error.textContent = '';

            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('show');

            const payload = {
                ssid: ssid.value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Connection failed');
                }
                window.location.href = '/done.html';
            } catch (err) {
                loadingOverlay.classList.remove('show');
                error.textContent = err.message;
                error.style.display = 'block';
                button.disabled = false;
            }
        }

        async function submitAdvancedForm(event) {
            event.preventDefault();
            const advancedButton = document.getElementById('advanced_button');
            const advancedError = document.getElementById('advanced_error');
            advancedButton.disabled = true;
            advancedError.style.display = 'none';
            advancedError.textContent = '';

            const config = {
                vad_threshold: parseInt(document.getElementById('vad_threshold').value),
                max_tx_power: parseInt(document.getElementById('max_tx_power').value),
                remember_bssid: document.getElementById('remember_bssid').checked,
                sleep_mode: document.getElementById('sleep_mode').checked
            };

            try {
                const response = await fetch('/advanced/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Save failed');
                }

                advancedButton.disabled = false;
                showToast(document.getElementById('language').value === 'pt-PT' ? 'Configuração salva!' : 'Configuration saved!');
            } catch (err) {
                advancedError.textContent = err.message;
                advancedError.style.display = 'block';
                advancedButton.disabled = false;
            }
        }

        // ========== UI Functions ==========
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(tab => {
                tab.classList.remove('active');
            });

            document.getElementById(tabName + '-tab').classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tabName}')"]`).classList.add('active');

            if (tabName === 'advanced') {
                startVadRmsPolling();
            } else {
                stopVadRmsPolling();
            }
        }

        let vadRmsInterval = null;

        function startVadRmsPolling() {
            if (vadRmsInterval) return;
            vadRmsInterval = setInterval(async () => {
                try {
                    const response = await fetch('/advanced/vad_rms');
                    const data = await response.json();
                    let maxRms = 4000;
                    let percent = (data.rms / maxRms) * 100;
                    if (percent > 100) percent = 100;
                    document.getElementById('vad_rms_bar').style.width = percent + '%';
                } catch (e) {
                    console.error('Failed to fetch VAD RMS', e);
                }
            }, 250);
        }

        function stopVadRmsPolling() {
            if (vadRmsInterval) {
                clearInterval(vadRmsInterval);
                vadRmsInterval = null;
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        async function loadAdvancedConfig() {
            try {
                const response = await fetch('/advanced/config');
                const data = await response.json();

                if (data.version) {
                    document.getElementById('firmware_version').innerText = 'v' + data.version;
                }
                if (data.vad_threshold) {
                    document.getElementById('vad_threshold').value = data.vad_threshold;
                    document.getElementById('vad_val').innerText = data.vad_threshold;
                }
                if (data.max_tx_power) {
                    document.getElementById('max_tx_power').value = data.max_tx_power;
                }
                if (data.remember_bssid !== undefined) {
                    document.getElementById('remember_bssid').checked = data.remember_bssid;
                }
                if (data.sleep_mode !== undefined) {
                    document.getElementById('sleep_mode').checked = data.sleep_mode;
                }
            } catch (error) {
                console.error('Error loading advanced config:', error);
            }
        }

        // ========== Initialization ==========
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            const browserLang = navigator.language || navigator.userLanguage;

            let defaultLang = 'en-US';
            if (browserLang.startsWith('pt')) defaultLang = 'pt-PT';
            else if (browserLang.startsWith('es')) defaultLang = 'es-ES';
            else if (browserLang.startsWith('fr')) defaultLang = 'fr-FR';
            else if (browserLang.startsWith('de')) defaultLang = 'de-DE';
            else if (browserLang.startsWith('it')) defaultLang = 'it-IT';

            const savedLang = langParam ||
                localStorage.getItem('preferred_language') ||
                defaultLang;

            document.getElementById('language').value = savedLang;
            changeLanguage();
            loadSavedList();
            loadAPList();
            loadAdvancedConfig();
        });

        ssid.addEventListener('touchstart', () => {
            ssid.removeAttribute('readonly');
            ssid.focus();
        }, { once: true });
    </script>
</body>

</html>
